operations:
  - create-table:
      name: "tax_rates"
      fields:
        id: { "type": integer, "primary-key": true }
        name: { "type": varchar, "max-length": 255, "null": true }
        numerator: { "type": smallint, "default": 0, "check": "numerator >= 0" }
        denominator:
          { "type": smallint, "default": 1, "check": "denominator >= 0" }
        created_at: { "type": timestamp }
      constraints:
        - name: unique_tax_properties
          unique: ["name", "numerator", "denominator"]
